name: ORB Scanner

on:
  schedule:
    # Cron is in UTC (IST = UTC + 5:30)
    - cron: '0,15,30,45 5 * * 1-5'   # 10:30, 10:45, 11:00, 11:15 IST
    - cron: '0,15 6 * * 1-5'         # 11:30, 11:45 IST (11:45 = catch-up run)
  workflow_dispatch:
    inputs:
      force:
        description: 'Test mode: scan last session, ignore time window'
        type: boolean
        default: false
      ping:
        description: 'Only send a Telegram test message'
        type: boolean
        default: false
      backtest:
        description: 'Backtest mode: past signals + results sent to Telegram'
        type: boolean
        default: false
      days:
        description: 'Backtest period, e.g. 7d, 30d, 60d (max 60d)'
        type: string
        default: '30d'

permissions:
  contents: write

concurrency:
  group: orb-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Telegram ping
        if: ${{ inputs.ping }}
        run: python orb_scanner.py --ping
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Backtest
        if: ${{ inputs.backtest && !inputs.ping }}
        run: python orb_scanner.py --backtest "$DAYS"
        env:
          DAYS: ${{ inputs.days }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Live scan
        if: ${{ !inputs.backtest && !inputs.ping }}
        run: python orb_scanner.py ${{ inputs.force && '--force' || '' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Save sent-signal state
        if: ${{ !inputs.backtest && !inputs.ping }}
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add sent.json || true
          git diff --cached --quiet || (git commit -m "update sent signals" && git pull --rebase && git push)
